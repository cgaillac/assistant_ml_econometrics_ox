[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxford-ml-ai"
version = "0.1.0"
description = "Scoped AI companion client for the Oxford ML Summer School coding exercise"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["oxford_ml_ai*"]
