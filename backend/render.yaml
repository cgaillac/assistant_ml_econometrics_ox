# Render.com Blueprint. In the Render dashboard: New -> Blueprint,
# point it at this repo, and Render will read this file automatically.
# You will be prompted to fill in OPENAI_API_KEY as a secret (never commit
# it). The free instance type is sufficient for a class of <30 with
# occasional bursts of use.
#
# Note: Render's free tier has an ephemeral filesystem, so the SQLite file
# is wiped on redeploy/restart. Student TOKENS survive this fine (they're
# self-verifying, signed with ADMIN_TOKEN -- see tokens.py) but the USAGE
# LOG does not: export it (export_log.py) before you redeploy if you care
# about that history, or attach a free persistent disk (Render dashboard ->
# your service -> Disks) mounted at /data and set
# AI_COMPANION_DB=/data/companion.db as an env var if you want it to survive
# automatically.

services:
  - type: web
    name: oxford-ml-ai-companion
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_COMPANION_MAX_TOKENS
        value: "600"
      - key: DEFAULT_DAILY_LIMIT
        value: "60"
      # Pin the Python version: Render's current default (3.14) is too new
      # for pydantic-core's prebuilt wheels, which forces a from-source
      # Rust build that fails in Render's build sandbox. 3.11 has wheels
      # for every pinned dependency here.
      - key: PYTHON_VERSION
        value: "3.11.9"
